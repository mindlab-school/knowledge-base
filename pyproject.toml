[project]
name = "kb-agent"
version = "0.1.0"
description = "KB Agent — corporate agentic knowledge base (Telegram + MCP + Claude API via OpenRouter)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "openai>=1.40",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "aiogram>=3.10",
    "trafilatura>=1.12",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Heavy document parsing (docling ML models). Loaded lazily in the ingestion process.
parse = [
    "docling>=2.18",
]
# Local ONNX embeddings (voyage-4-nano int8). Loaded lazily and unloaded on idle.
embed-local = [
    "onnxruntime>=1.18",
    "tokenizers>=0.20",
]
# MCP stdio server for the Claude Code plugin.
mcp = [
    "mcp>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.7",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb"]

[tool.uv]
package = true

# ----------------------------------------------------------------------------
# Ruff — lint + format
# ----------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "scripts", "tests", "plugin"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "RUF001", # ambiguous unicode in strings — expected (Russian/Cyrillic content)
    "RUF002", # ambiguous unicode in docstrings — expected (Russian/Cyrillic content)
    "RUF003", # ambiguous unicode in comments — expected (Russian/Cyrillic content)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["kb"]

# ----------------------------------------------------------------------------
# mypy — strict on our code
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]
files = ["src/kb", "scripts", "plugin/mcp"]

[[tool.mypy.overrides]]
module = [
    "asyncpg.*",
    "pgvector.*",
    "docling.*",
    "onnxruntime.*",
    "trafilatura.*",
    "tokenizers.*",
    "testcontainers.*",
    "mcp.*",
]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require a PostgreSQL+pgvector container (deselect with -m 'not integration')",
]
